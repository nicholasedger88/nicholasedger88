<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Markets in 90 Seconds</title>
  </head>
  <body style="font-family: Arial, sans-serif; color: #111;">
    <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
      <tr>
        <td style="padding: 24px;">
          <h1 style="margin: 0 0 8px;">Markets in 90 Seconds</h1>
          <p style="margin: 0 0 16px; color: #555;">{{ summary }}</p>
          <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
            {% for market in markets %}
            <tr>
              <td style="padding: 8px 0; border-bottom: 1px solid #eee;">
                <strong>{{ market.name }}</strong><br />
                <span style="color: #555;">1D {{ '%+.2f'|format(market.change_1d) }}% · 5D {{ '%+.2f'|format(market.change_5d) }}% · YTD {{ '%+.2f'|format(market.change_ytd) }}%</span>
              </td>
            </tr>
            {% endfor %}
          </table>
          <p style="margin-top: 24px; font-size: 12px; color: #777;">
            Unsubscribe: <a href="{{ unsubscribe_url }}">{{ unsubscribe_url }}</a>
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
